name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    name: Lint, Build, and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Set Docker Hub Username
        run: |
          USER="${{ vars.DOCKERHUB_USERNAME }}"
          if [ -z "$USER" ]; then
            USER="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          if [ -z "$USER" ]; then
            USER="aangishah3306"
          fi
          echo "DOCKER_USER=$USER" >> $GITHUB_ENV
          echo "Successfully configured Docker Hub username: $USER"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_USER }}/python-cicd-app:latest
