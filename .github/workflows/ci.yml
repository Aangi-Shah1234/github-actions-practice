
# Goal: Build the image for DevBoard Frontend and Push to Docker Hub

name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Docker Hub username
        run: echo "Username is ${{ vars.DOCKERHUB_USERNAME }}"

      - name: Docker Setup [Login to Docker Hub]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: aangishah3306/aangi-shah:latest
